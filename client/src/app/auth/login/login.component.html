<div class="auth-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ lang.t("login") }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>{{ lang.t("emailLabel") }}</mat-label>
          <input
            matInput
            formControlName="email"
            type="email"
            placeholder="tu@email.com"
          />
          <mat-error
            *ngIf="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
            >{{ lang.t("emailError") }}</mat-error
          >
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>{{ lang.t("passwordLabel") }}</mat-label>
          <input
            matInput
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="toggleShowPassword()"
            aria-label="Mostrar contraseña"
          >
            <mat-icon>{{
              showPassword ? "visibility_off" : "visibility"
            }}</mat-icon>
          </button>
          <mat-error
            *ngIf="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
            >{{ lang.t("passwordError") }}</mat-error
          >
        </mat-form-field>

        <div *ngIf="error" style="color: #b00020; margin-bottom: 8px">
          {{ error }}
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid || loading"
        >
          {{ loading ? lang.t("entering") : lang.t("enter") }}
        </button>
      </form>

      <div
        style="margin-top: 16px; text-align: center; color: var(--text-muted)"
      >
        O
      </div>

      <div
        id="google-signin-button"
        style="margin-top: 16px; display: flex; justify-content: center"
      ></div>
    </mat-card-content>
    <mat-card-actions>
      <a routerLink="/register">{{ lang.t("noAccount") }}</a>
    </mat-card-actions>
  </mat-card>
</div>
