<section class="settings-viewport">
  <mat-card class="settings-card">
    <div class="avatar-col">
      <div class="avatar-box">
        <img
          *ngIf="profileImgSrc"
          [src]="profileImgSrc"
          alt="avatar"
          (error)="onProfileImgError()"
          class="avatar-image"
        />
        <div *ngIf="!profileImgSrc" class="avatar-fallback">
          {{ fallbackInitials }}
        </div>
        <input
          #fileInput
          type="file"
          accept="image/*"
          hidden
          (change)="onFileSelected($event)"
        />
        <button
          mat-stroked-button
          class="avatar-action"
          type="button"
          (click)="triggerFileInput(fileInput)"
        >
          <mat-icon>photo_camera</mat-icon>
        </button>
        <button
          *ngIf="profileImgSrc"
          mat-stroked-button
          class="avatar-delete"
          type="button"
          (click)="deleteProfileImage()"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <div class="settings-content">
      <mat-card-title class="settings-title">{{
        lang.t("userSettings")
      }}</mat-card-title>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>{{ lang.t("nombre") }}</label>
            <mat-form-field appearance="fill" class="full-width">
              <input matInput formControlName="nombre" />
            </mat-form-field>
          </div>

          <div class="form-group">
            <label>{{ lang.t("email") }}</label>
            <div class="readonly-field">{{ auth.getUser()?.email }}</div>
          </div>

          <div class="form-group">
            <label>{{ lang.t("currency") }}</label>
            <select formControlName="moneda_preferida" class="custom-select">
              <option *ngFor="let c of currencyOptions" [value]="c.code">
                {{ c.symbol }} - {{ c.label }}
              </option>
            </select>
          </div>

          <div class="button-row">
            <button mat-button type="button" (click)="cancel()">
              {{ lang.t("cancel") }}
            </button>
            <button
              mat-flat-button
              color="primary"
              type="submit"
              [disabled]="form.invalid"
            >
              {{ lang.t("save") }}
            </button>
          </div>
          <div class="button-row-left">
            <button
              mat-stroked-button
              class="danger-btn"
              type="button"
              (click)="confirmDelete()"
            >
              {{ lang.t("deleteAccount") }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </div>
  </mat-card>
</section>
