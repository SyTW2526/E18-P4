<div class="gasto-viewport">
  <div class="gasto-container">
    <!-- Header Section -->
    <header class="gasto-header">
      <button class="back-btn" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2 class="gasto-title">
        <mat-icon class="title-icon">{{
          editMode ? "edit" : "add_circle"
        }}</mat-icon>
        {{
          editMode
            ? lang.t("edit") + " " + lang.t("expenses").toLowerCase()
            : lang.t("addExpense")
        }}
      </h2>
    </header>

    <!-- Main Content Card -->
    <div class="gasto-card">
      <!-- Description Section -->
      <div class="form-section">
        <label class="section-label">
          <mat-icon>description</mat-icon>
          {{ lang.t("description") }}
        </label>
        <input
          class="form-input full-width"
          [placeholder]="lang.t('description')"
          [(ngModel)]="descripcion"
          name="descripcion"
          type="text"
        />
      </div>

      <!-- Amount, Currency & Date Section -->
      <div class="form-section">
        <label class="section-label">
          <mat-icon>payments</mat-icon>
          Detalles del Gasto
        </label>
        <div class="form-row">
          <div class="form-field">
            <input
              class="form-input"
              [placeholder]="lang.t('amount')"
              [(ngModel)]="monto"
              name="monto"
              type="number"
              step="0.01"
            />
          </div>

          <div
            class="form-field"
            [appClickOutsideEnabled]="currencyMenuOpen"
            (appClickOutside)="currencyMenuOpen = false"
          >
            <button
              type="button"
              class="form-select"
              (click)="currencyMenuOpen = !currencyMenuOpen"
            >
              <span class="select-label">{{ lang.t("currency") }}:</span>
              <span class="select-value">{{ moneda }}</span>
              <mat-icon [ngClass]="{ 'dropdown-arrow-open': currencyMenuOpen }"
                >arrow_drop_down</mat-icon
              >
            </button>
            <div *ngIf="currencyMenuOpen" class="dropdown-menu">
              <button
                class="dropdown-item"
                *ngFor="let opt of ['EUR', 'USD', 'GBP']"
                (click)="moneda = opt; currencyMenuOpen = false"
              >
                <span>{{ opt }}</span>
                <mat-icon *ngIf="moneda === opt">check</mat-icon>
              </button>
            </div>
          </div>

          <div class="form-field date-field">
            <input
              class="form-input"
              [placeholder]="lang.t('date')"
              [(ngModel)]="fecha"
              name="fecha"
              type="date"
            />
          </div>
        </div>
      </div>

      <!-- Payer Section -->
      <div class="form-section">
        <label class="section-label">
          <mat-icon>person</mat-icon>
          {{ lang.t("paidBy") }}
        </label>
        <div
          class="form-field full-width"
          [appClickOutsideEnabled]="pagadorMenuOpen"
          (appClickOutside)="pagadorMenuOpen = false"
        >
          <button
            type="button"
            class="form-select"
            (click)="pagadorMenuOpen = !pagadorMenuOpen"
          >
            <span class="select-value">{{
              displayMember(getMemberById(pagador))
            }}</span>
            <mat-icon [ngClass]="{ 'dropdown-arrow-open': pagadorMenuOpen }"
              >arrow_drop_down</mat-icon
            >
          </button>
          <div *ngIf="pagadorMenuOpen" class="dropdown-menu">
            <button
              class="dropdown-item"
              *ngFor="let m of miembros"
              (click)="pagador = m._id || m.id; pagadorMenuOpen = false"
            >
              <span>{{ displayMember(m) }}</span>
              <mat-icon *ngIf="pagador === (m._id || m.id)">check</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Participants Section -->
      <div class="form-section participants-section">
        <div class="section-header">
          <label class="section-label">
            <mat-icon>group</mat-icon>
            Participantes
          </label>
          <button class="divide-btn" type="button" (click)="recalcSplit()">
            <mat-icon>calculate</mat-icon>
            {{ lang.t("divide") }}
          </button>
        </div>

        <div class="participants-list">
          <div
            *ngFor="let p of participaciones; let i = index"
            class="participant-item"
          >
            <mat-checkbox
              [(ngModel)]="p.selected"
              (change)="onToggleParticipant(i)"
              class="participant-checkbox"
            ></mat-checkbox>
            <span class="participant-name">{{ displayMember(p.user) }}</span>
            <input
              class="participant-amount"
              [placeholder]="lang.t('amount')"
              type="number"
              step="0.01"
              [(ngModel)]="p.monto_asignado"
              (ngModelChange)="onAmountChange(i)"
            />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button
          class="btn-primary"
          (click)="createGasto()"
          [disabled]="creating"
        >
          <mat-icon>{{ editMode ? "save" : "add" }}</mat-icon>
          {{ editMode ? lang.t("save") : lang.t("add") }}
        </button>
        <button class="btn-secondary" (click)="goBack()">
          <mat-icon>close</mat-icon>
          {{ lang.t("cancel") }}
        </button>
      </div>
    </div>
  </div>
</div>
