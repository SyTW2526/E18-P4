<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaySplit</title>
      <link rel="icon" type="image/png" href="./Recursos/favicon.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

    body {margin: 0; 
      background-image: linear-gradient(to bottom, #000000 0%, color-mix(in srgb, #000000 60%, #4F9E55) 100%, #4F9E55 100%);
      font-family: "Outfit", sans-serif;
    overflow-x: hidden;}

    .logo-fixed {
      position: fixed;
      top: 1.8rem;
      left: 8rem;
      width: 15vw;
      z-index: 1000;
    }

    .logo {
  transition: filter 0.35s ease, transform 0.35s ease;
}

.logo:hover {
  filter: drop-shadow(0 0 12px rgb(21, 158, 55));
  transform: scale(1.06);
}

    header {
      width: 100%;
      display: flex;
      justify-content: center;
      position: fixed;
      top: 1.5rem;
      left: 0;
      z-index: 900;
    }

    .header-inner {display: flex;
    flex-direction: row;
    gap: 3rem}

    .header-inner button {
      background: transparent;
      border: 1px solid #7ae582;
      padding: 0.5rem 2rem;
      border-radius: 2rem;
      display: flex;
      gap: 2rem;
      align-items: center;
      color:#7ae582;
      font-family: Outfit;
      font-weight: 600;
      margin-top:0.3rem;
    }

    .header-inner a {
      color: #7ae582;
      text-decoration: none;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .header-inner button:hover {
      color: #000000;
      background-color: #7ae582;
      cursor: pointer;
    }

    .header-inner button:active {
      cursor: grabbing;
    }

    .header-right {
    position: fixed;
    padding: 1vh 15vw;
    box-sizing: border-box; 
  }

    .header-right a{
      font-weight: 800;
      font-size: 9pt;
      color:#000000;
      text-decoration: none;
      font-family: Outfit;
    }

  .lang_button {
  border-radius: 2rem; 
  background-color: #7ae582;
  border: none;
  padding: 0.3rem 1rem;
  display: flex;
  align-items: center; 
  gap: 0.5rem;
  cursor: pointer;
}

.lang_button img {
  height: 1rem;
  width: auto;
}

.lang_button span {
  font-weight: 800;
  font-size: 9pt;
  color: #000;
  font-family: Outfit, sans-serif;
}

  .page-body {display: grid;
  grid-template-columns: auto auto auto;
  grid-gap: 5rem;
  justify-content: center;
  justify-items: center;
  }

  .pb-left{ margin-left: 10vw; margin-top: 15vh; align-items: center;}

  .pb-left p{ color: white; font-weight: 150;
  font-size: 20pt;
  width: 30vw;}

  .pb-middle {margin-top: 20rem;
  align-items: center;
  display: flex;
  flex-direction: column;
  gap: 1rem;}

  .pb-middle button {height: 10rem; width: 16rem;
  background-color: #7ae582;
  border-radius: 2rem;
  border: none;}

  .pb-middle button:hover {background-color: #000000;}

  .main-logo {width: 40rem;
  margin-top: 12rem;}

  .illustration{height: 90vh; 
  position:sticky;
  margin-top: 12rem;
  z-index: -3;
  margin-right: 10vw; 
  }

  .ad1, .ad2 {
  position: absolute;
  z-index: 10;
  background-image: linear-gradient(to top, rgba(79, 158, 85, 0.2), #172b11);
  width: 10rem;
  height: 10rem;
  border-radius: 2rem;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35pt;
  font-weight: 800;
}

  .ad1 {
  top: 60vh;
  left: 70vw;
}

.ad2 {
  top: 40vh;
  left: 80vw;
}

  footer{background-color: white; 
  margin-bottom: 0; 
  position: absolute;
  justify-self: center;
  text-align: center;
  height: 20vh;
  z-index:99;
  width: 100vw;}

  footer p {font-size: 14pt; font-weight: 700;}

  footer div{width: 50vw; background-color: #000000; 
    height: 1pt; justify-self: center; border-radius: 1px;}
  
  .social-footer {
  display: flex;
  gap: 12px;
  list-style: none;
  padding: 0;
  margin: 0;
  color: #000000;
  justify-content: center;
  margin-top: 2vh;
}

.social-footer a {
  width: 2rem;
  height: 2rem;
  border: 1.5px solid #000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  text-decoration: none;
  transition: all 0.25s ease;
  font-size: 18px;
}

.social-footer svg {
  width: 20px;
  height: 20px;
  display: block;
}

.social-footer a:hover {
  background-color: #000;
  color: #fff;}

.credits{ font-size: 10pt; margin-top: 1rem; font-weight: 300;}
 
  </style>
</head>
<body>


  <div class="logo-fixed">
    <img class="logo" src="./Recursos/logo_paysplit_def.svg">
  </div>

  <header>
    <nav class="header-inner">
      <a href="#link1"><button>INICIAR SESIÓN</button></a>
      <a href="#link2"><button>REGISTRARSE</button></a>
    </nav>
    <div>
    <nav class="header-right">
      <button class="lang_button">
  <img src="https://hatscripts.github.io/circle-flags/flags/es.svg" alt="ES">
  <span>ES</span>
</button>
    </nav>
  </div>
  </header>


  <div class="page-body">
      <div class="pb-left">
        <img class="main-logo" src="./Recursos/logo_paysplit_def.svg">
      <p>PaySplit es la herramienta definitiva para bla bla bla. Con ella, podrás 
      distribuir los gatos entre varias personas <b>sin complicaciones</b>.</p>  
      </div>
      <div class="pb-middle">
      <button></button>
      <button></button>
      <button></button>
     </div>
      <div>
      <img class="illustration" src="./Recursos/ilustracion1.svg">
    </div>
  </div>

  <div class="ad1"><p>+10k</p></div>
  <div class="ad2"><p>4,8/5</p></div>

  <footer>
  <p>Frase de ejemplo. Aquí podría ir un eslogan o algo.</p>
  <div></div>
  <ul class="social-footer">
  <li>
    <a href="www.facebook.com" aria-label="Facebook">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.3.2 2.3.2v2.5h-1.3c-1.3 0-1.7.8-1.7 1.6V12h2.9l-.5 2.9h-2.4v7A10 10 0 0 0 22 12z"/>
      </svg>
    </a>
  </li>
  <li>
    <a href="www.instagram.com" aria-label="Instagram">
       <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm10 2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h10zm-5 3.5A4.5 4.5 0 1 0 16.5 12 4.5 4.5 0 0 0 12 7.5zm0 7.4A2.9 2.9 0 1 1 14.9 12 2.9 2.9 0 0 1 12 14.9zM17.8 6.2a1 1 0 1 0 1 1 1 1 0 0 0-1-1z"/>
      </svg>
    </a>
  </li>
  <li>
    <a href="www.x.com" aria-label="X">
       <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.9 2H21l-6.6 7.5L22 22h-6.2l-4.9-6.4L5.4 22H3.3l7-8L2 2h6.3l4.4 5.8L18.9 2z"/>
      </svg>
    </a>
  </li>
</ul>
<p class="credits">Grupo 18 © 2026.</p>
</footer>

</body>

</html>
