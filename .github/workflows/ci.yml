name: CI

on:
  push:
    branches: [ main, dev ]

jobs:
  tests:
    name: Run tests (server + client)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Export Puppeteer chrome path (if available)
        shell: bash
        run: |
          if [ -d client ]; then
            CHROME_BIN=$(find client/node_modules/puppeteer -type f -name chrome -print -quit 2>/dev/null || true)
            if [ -n "$CHROME_BIN" ]; then
              echo "CHROME_BIN=$CHROME_BIN" >> $GITHUB_ENV
            fi
          fi

      - name: Set DB env vars
        env:
          ATLAS_SECRET: ${{ secrets.ATLAS_URI }}
        run: |
          if [ -n "$ATLAS_SECRET" ]; then
            echo "MONGO_TEST_URI=$ATLAS_SECRET" >> $GITHUB_ENV
            echo "ATLAS_URI=$ATLAS_SECRET" >> $GITHUB_ENV
          else
            echo "MONGO_TEST_URI=mongodb://localhost:27017" >> $GITHUB_ENV
            echo "ATLAS_URI=mongodb://localhost:27017" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Cache server dependencies
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-node-modules-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Cache client dependencies
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: client-node-modules-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install client & server dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: Export Puppeteer chrome path (if available)
        shell: bash
        run: |
          if [ -d client ]; then
            CHROME_BIN=$(find client/node_modules/puppeteer -type f -name chrome -print -quit 2>/dev/null || true)
            if [ -n "$CHROME_BIN" ]; then
              echo "CHROME_BIN=$CHROME_BIN" >> $GITHUB_ENV
            fi
          fi

      - name: Set DB env vars
        env:
          ATLAS_SECRET: ${{ secrets.ATLAS_URI }}
        run: |
          if [ -n "$ATLAS_SECRET" ]; then
            echo "MONGO_TEST_URI=$ATLAS_SECRET" >> $GITHUB_ENV
            echo "ATLAS_URI=$ATLAS_SECRET" >> $GITHUB_ENV
          else
            echo "MONGO_TEST_URI=mongodb://localhost:27017" >> $GITHUB_ENV
            echo "ATLAS_URI=mongodb://localhost:27017" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Show DB in use
        run: echo "Using MONGO_TEST_URI=${MONGO_TEST_URI}"

      - name: Run server tests
        working-directory: server
        run: |
          npm test

      - name: Run client tests (headless)
        working-directory: client
        run: |
          npm run test:ci

      - name: Upload client coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage || client/coverage/client

  e2e:
    name: E2E tests (Selenium)
    runs-on: ubuntu-latest
    needs: tests
    # Run E2E on all branches (including dev). If you want to limit to main, re-add an `if` condition here.
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install server, client and e2e deps
        run: |
          cd server && npm ci
          cd ../client && npm ci
          cd ../e2e && npm ci

      - name: Start server (Docker, background)
        env:
          ATLAS_SECRET: ${{ secrets.ATLAS_URI }}
        run: |
          # Decide which Mongo URI to provide to the container
          if [ -z "$ATLAS_SECRET" ]; then
            ATLAS_URI="mongodb://localhost:27017"
          else
            ATLAS_URI="$ATLAS_SECRET"
          fi

          # Build Docker image for the server
          docker build -t paysplit-server:ci server

          # Run the server container using host networking so it can reach the Actions' mongodb service on localhost
          docker run -d --rm --network host -e ATLAS_URI="$ATLAS_URI" --name paysplit-server paysplit-server:ci

          # Wait until the server answers on localhost:5200
          npx wait-on http://localhost:5200
        shell: bash

      - name: Build and serve client
        run: |
          cd client
          npm run build --if-present
          # Find first dist directory and serve it, otherwise run ng serve
          DIST_DIR=$(find dist -maxdepth 1 -type d | head -n 1 || true)
          if [ -n "$DIST_DIR" ]; then
            npx http-server "$DIST_DIR" -p 4200 -a 127.0.0.1 &
          else
            npm run start -- --host 127.0.0.1 --port 4200 &
          fi
          npx wait-on http://localhost:4200
        shell: bash

      - name: Run E2E Mocha tests
        working-directory: e2e
        run: |
          npx mocha tests --reporter spec
        shell: bash
